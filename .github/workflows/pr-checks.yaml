name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: permitgate
          POSTGRES_PASSWORD: permitgate
          POSTGRES_DB: permitgate_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          cd server
          uv sync --extra dev

      - name: Run ruff check
        run: |
          cd server
          ruff check src tests

      - name: Run ruff format check
        run: |
          cd server
          ruff format --check src tests

      - name: Run header validation (vph)
        run: |
          cd server
          validate-python-headers

      - name: Run unit tests
        run: |
          cd server
          pytest tests/unit -v

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://permitgate:permitgate@localhost:5432/permitgate_test
        run: |
          cd server
          pytest tests/integration -v
